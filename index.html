<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Woosik's Slide Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <h1>Woosik's Slide Generator</h1>
      <div class="lang-switch" role="tablist" aria-label="Language switcher">
        <button id="langKo" class="lang-btn active" type="button">한국어</button>
        <button id="langEn" class="lang-btn" type="button">English</button>
      </div>
    </header>

    <main class="workspace">
      <section class="panel upload-panel">
        <h2 data-i18n="uploadTitle">파일 업로드</h2>
        <p class="panel-desc" data-i18n="uploadDesc">
          PDF 또는 Word(.docx) 파일을 드래그하거나 선택해 주세요.
        </p>

        <label id="dropZone" class="drop-zone" for="fileInput">
          <input id="fileInput" type="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
          <span class="drop-title" data-i18n="dropTitle">파일을 여기에 놓으세요</span>
          <span class="drop-sub" data-i18n="dropSub">또는 클릭해서 업로드</span>
        </label>

        <div class="file-meta">
          <p id="selectedFile" data-i18n="noFile">선택된 파일이 없습니다.</p>
          <p id="statusText" class="status"></p>
        </div>
      </section>

      <section class="panel preview-panel">
        <h2 data-i18n="previewTitle">PPT 미리보기</h2>
        <p class="panel-desc" data-i18n="previewDesc">
          맥킨지 스타일의 슬라이드 구조로 자동 변환된 결과를 확인하세요.
        </p>
        <div id="previewContainer" class="preview-container">
          <div class="empty-preview" data-i18n="previewEmpty">업로드 후 미리보기가 표시됩니다.</div>
        </div>
      </section>
    </main>

    <section class="download-tab">
      <div class="download-head">
        <h3>Download</h3>
        <p data-i18n="downloadDesc">파일 이름을 확인한 뒤 원하는 위치에 저장하세요.</p>
      </div>

      <div class="download-actions">
        <label for="fileNameInput" data-i18n="fileNameLabel">파일 이름</label>
        <input id="fileNameInput" type="text" value="woosik-slide-deck.pptx" />
        <button id="downloadBtn" type="button" disabled data-i18n="downloadBtn">PPT 다운로드</button>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
  <script src="https://unpkg.com/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
